[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timing-closure-lab"
version = "1.0.0"
description = "Timing-closure experiment lab: yosys -> nextpnr-ecp5 -> STA, with an SDC parser, equivalence checking and a VCD-based relative power study"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "timing-closure-lab contributors" }]
keywords = ["fpga", "sta", "sdc", "timing-closure", "yosys", "nextpnr", "ecp5", "lec"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

# No runtime dependencies: the parsing, STA and power layers are pure standard
# library. yosys / nextpnr-ecp5 / iverilog are external binaries, not packages.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
tclab = "tclab.cli:main"

[project.urls]
Homepage = "https://github.com/meminehobe24435-cmyk/timing-closure-lab"

[tool.setuptools]
packages = ["tclab"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "eda: test requires the local OSS CAD Suite toolchain (yosys/nextpnr/iverilog)",
]
filterwarnings = ["error::DeprecationWarning"]
